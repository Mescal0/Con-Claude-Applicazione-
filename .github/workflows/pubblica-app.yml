name: Pubblica l'app su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Attiva GitHub Pages se necessario
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepara i file dell'app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
